name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No lockfile is committed on GitHub, so use install rather than ci.
      - run: npm install --no-audit --no-fund
      - run: npm run validate
      - run: npm run build
